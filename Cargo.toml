[package]
name = "rot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fast, Rust-aware source metrics"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
ra_ap_cfg = { version = "=0.0.349", features = ["syntax"] }
ra_ap_syntax = "=0.0.349"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
