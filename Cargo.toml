[workspace]
members = ["crates/rot-compiler-protocol"]
exclude = ["compiler/rot-rustc-driver"]
resolver = "3"

[package]
name = "rot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Fast, Rust-aware source metrics"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
md-5 = "0.10"
ra_ap_cfg = { version = "=0.0.349", features = ["syntax"] }
ra_ap_syntax = "=0.0.349"
rayon = "1.12.0"
rot-compiler-protocol = { path = "crates/rot-compiler-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.23.0"
toml = "1.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
