[workspace]
members = ["crates/rot-compiler-protocol"]
default-members = ["."]
exclude = ["compiler/rot-rustc-driver"]
resolver = "3"

[workspace.package]
version = "0.1.3"

[workspace.dependencies]
rot-compiler-protocol = { path = "crates/rot-compiler-protocol", version = "=0.1.3" }

[package]
name = "rot-metrics"
version.workspace = true
edition = "2024"
rust-version = "1.98"
default-run = "rot"
description = "Fast, Rust-aware source metrics"
license = "Apache-2.0"
repository = "https://github.com/daulet/rot"
homepage = "https://github.com/daulet/rot"
readme = "README.md"
keywords = ["complexity", "metrics", "rust", "source-code"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "compiler/supported-rustc.toml",
    "docs/releases.md",
    "docs/rustc-backed-analysis.md",
    "README.md",
    "LICENSE-APACHE",
]

[lib]
name = "rot"
path = "src/lib.rs"

[features]
default = []
audit = [
    "dep:rot-compiler-protocol",
]

[[bin]]
name = "rot"
path = "src/main.rs"

[[bin]]
name = "rot-audit"
path = "src/bin/rot-audit.rs"
required-features = ["audit"]

[[test]]
name = "compiler_pipeline"
path = "tests/compiler_pipeline.rs"
required-features = ["audit"]

[[test]]
name = "compiler_profile"
path = "tests/compiler_profile.rs"
required-features = ["audit"]

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23.1"
cargo-platform = "0.3.3"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
ra_ap_cfg = { version = "=0.0.349", features = ["syntax"] }
ra_ap_syntax = "=0.0.349"
rayon = "1.12.0"
rot-compiler-protocol = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabwriter = "1.4.1"
tempfile = "3.23.0"
toml = "1.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[package.metadata.dist]
formula = "rot"
display-name = "rot"
unix-archive = ".tar.gz"
include = ["docs/releases.md", "docs/rustc-backed-analysis.md"]

[package.metadata.dist.binaries]
aarch64-apple-darwin = ["rot"]
x86_64-apple-darwin = ["rot"]
aarch64-unknown-linux-musl = ["rot"]
x86_64-unknown-linux-musl = ["rot"]

[package.metadata.deb]
name = "rot"
maintainer = "Rot contributors <daulet@users.noreply.github.com>"
copyright = "2026, Daulet Zhanguzin"
license-file = ["LICENSE-APACHE", "0"]
extended-description = "Fast, Rust-aware source metrics"
section = "utils"
priority = "optional"
revision = ""
assets = [
    ["target/release/rot", "usr/bin/", "755"],
    ["LICENSE-APACHE", "usr/share/doc/rot/LICENSE-APACHE", "644"],
]
