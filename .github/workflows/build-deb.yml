name: Build Debian packages

on:
  workflow_call:
    inputs:
      plan:
        description: dist release plan JSON
        required: true
        type: string

permissions: {}

env:
  RUST_VERSION: 1.98.0

jobs:
  build:
    name: Debian package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: dist
          pattern: artifacts-build-local-*

      - name: Stage native binary
        id: release
        env:
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          version=$(jq -er '
            [.releases[]? | select(.app_name == "rot-metrics") | .app_version]
            | if length == 1 then .[0]
              else error("expected exactly one rot-metrics release")
              end
          ' <<<"$PLAN")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version in dist plan: ${version}" >&2
            exit 1
          fi

          mapfile -t archives < <(
            find dist -type f -name "rot-metrics-${TARGET}.tar.gz" -print
          )
          if [[ "${#archives[@]}" != 1 ]]; then
            echo "Expected exactly one rot-metrics-${TARGET}.tar.gz archive." >&2
            printf 'found: %s\n' "${archives[@]:-<none>}" >&2
            exit 1
          fi

          mkdir -p extracted
          tar -xzf "${archives[0]}" -C extracted
          extracted_binary="extracted/rot-metrics-${TARGET}/rot"
          if [[ ! -f "$extracted_binary" ]]; then
            echo "Archive does not contain ${extracted_binary}." >&2
            exit 1
          fi

          staged_binary="target/${TARGET}/release/rot"
          install -D -m 0755 "$extracted_binary" "$staged_binary"
          readelf --file-header "$staged_binary" >/dev/null
          program_headers=$(readelf --program-headers "$staged_binary")
          if grep -Fq 'Requesting program interpreter' <<<"$program_headers"; then
            echo "${staged_binary} has a dynamic program interpreter." >&2
            exit 1
          fi
          dynamic_section=$(readelf --dynamic "$staged_binary" 2>/dev/null)
          if grep -Fq '(NEEDED)' <<<"$dynamic_section"; then
            echo "${staged_binary} has dynamic library dependencies." >&2
            exit 1
          fi
          test "$("$staged_binary" --version)" = "rot ${version}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Build and smoke-test Debian package
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          package="dist/rot_${VERSION}_${ARCH}.deb"
          cargo deb \
            --no-build \
            --no-strip \
            --target "$TARGET" \
            -p rot-metrics \
            --output "$package"

          test "$(dpkg-deb --field "$package" Package)" = rot
          test "$(dpkg-deb --field "$package" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$package" Architecture)" = "$ARCH"
          sudo dpkg --install "$package"
          cleanup() {
            sudo dpkg --remove rot >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          test "$(/usr/bin/rot --version)" = "rot ${VERSION}"
          sudo dpkg --remove rot
          trap - EXIT

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: artifacts-build-deb-${{ matrix.arch }}
          overwrite: true
          path: dist/rot_${{ steps.release.outputs.version }}_${{ matrix.arch }}.deb
          retention-days: 7
