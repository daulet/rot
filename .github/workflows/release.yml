name: Release planner

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: rot-release-main
  queue: max

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  prepare:
    name: Plan version commit
    if: >-
      vars.RELEASES_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout complete history with release identity
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Plan release
        id: plan
        env:
          SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
          python3 .github/scripts/release.py plan \
            --source "$SOURCE" \
            --remote-ref origin/main \
            --github-output "$GITHUB_OUTPUT"

      - name: Explain no-op
        if: steps.plan.outputs.state != 'new'
        env:
          STATE: ${{ steps.plan.outputs.state }}
        run: echo "Release planning is a no-op for state ${STATE}."

      - name: Install Rust
        if: steps.plan.outputs.state == 'new'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Push version commit for exact CI
        if: steps.plan.outputs.state == 'new'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SOURCE: ${{ steps.plan.outputs.source }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git checkout --detach "$SOURCE"
          python3 .github/scripts/release.py set-version "$VERSION"
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo package -p rot-compiler-protocol --locked --allow-dirty
          cargo package -p rot-metrics --list --allow-dirty \
            >target/rot-metrics-package-files.txt
          grep -Fx compiler/supported-rustc.toml target/rot-metrics-package-files.txt
          cargo package -p rot-metrics --locked --allow-dirty \
            --config 'patch.crates-io.rot-compiler-protocol.path="crates/rot-compiler-protocol"'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Cargo.toml Cargo.lock \
            crates/rot-compiler-protocol/Cargo.toml \
            compiler/rot-rustc-driver/Cargo.toml \
            compiler/rot-rustc-driver/Cargo.lock
          git diff --cached --check
          git commit --allow-empty \
            -m "chore(release): ${TAG}" \
            -m "Release-Source: ${SOURCE}" \
            -m "Release-Automation: rot-v1"
          release_sha=$(git rev-parse HEAD)

          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "$SOURCE" ]]; then
            echo "Main advanced before the version-commit push; a newer run owns the release."
            exit 0
          fi
          test -n "$RELEASE_TOKEN"
          if ! git push origin "HEAD:refs/heads/main"; then
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if [[ "$(git rev-parse origin/main)" != "$SOURCE" ]]; then
              echo "Main advanced during the version-commit push; a newer run owns the release."
              exit 0
            fi
            echo "Version-commit push failed without a main race." >&2
            exit 1
          fi
          echo "Created ${release_sha}; its credentialed push starts exact-commit CI and publication."
