name: Publish release

on:
  workflow_call:

permissions: {}

concurrency:
  group: rot-release-main
  queue: max

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  prepare:
    name: Verify and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.tag.outputs.ready == 'true' }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      source: ${{ steps.plan.outputs.source }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify exact CI-proven release commit
        id: plan
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
          python3 .github/scripts/release.py plan \
            --source "$RELEASE_SHA" \
            --remote-ref origin/main \
            --github-output "$GITHUB_OUTPUT"
          state=$(sed -n 's/^state=//p' "$GITHUB_OUTPUT")
          planned_sha=$(sed -n 's/^release_sha=//p' "$GITHUB_OUTPUT")
          if [[ "$state" == superseded ]]; then
            replacement=$(sed -n 's/^superseded_by_tag=//p' "$GITHUB_OUTPUT")
            echo "This generated release was superseded by ${replacement}; publication is a no-op."
            exit 0
          fi
          if [[ "$state" != pending || "$planned_sha" != "$RELEASE_SHA" ]]; then
            echo "Publish was called for an unproven or non-release commit." >&2
            exit 1
          fi

      - name: Create or verify annotated tag
        id: tag
        if: steps.plan.outputs.state == 'pending'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
          SOURCE: ${{ steps.plan.outputs.source }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git cat-file -t "refs/tags/${TAG}")" = tag
            test "$(git rev-list -n1 "refs/tags/${TAG}")" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$RELEASE_SHA" \
              -m "Rot ${TAG}" \
              -m "Source: ${SOURCE}" \
              -m "Release: ${RELEASE_SHA}" \
              -m "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Recovering the existing GitHub release for ${TAG}."
          fi
          echo "ready=true" >>"$GITHUB_OUTPUT"


  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            deb_arch: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            deb_arch: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout generated release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.deb_arch != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build and smoke test
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --release --locked --no-default-features --bin rot --target "$TARGET"
          binary="target/${TARGET}/release/rot"
          test "$("$binary" --version)" = "rot ${VERSION}"
          if [[ "$TARGET" == *-linux-musl ]] && readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "Linux release binary is dynamically linked." >&2
            exit 1
          fi

      - name: Package archive and Debian asset
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          mkdir -p dist
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${{ needs.prepare.outputs.release_sha }}")
          python3 .github/scripts/release.py archive \
            --binary "target/${TARGET}/release/rot" \
            --output "dist/rot-${TARGET}.tar.gz" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          if [[ -n "$DEB_ARCH" ]]; then
            .github/scripts/package-deb.sh \
              --binary "target/${TARGET}/release/rot" \
              --version "$VERSION" \
              --arch "$DEB_ARCH" \
              --out-dir dist
            sudo dpkg --install "dist/rot_${VERSION}_${DEB_ARCH}.deb"
            test "$(rot --version)" = "rot ${VERSION}"
            sudo dpkg --remove rot
          fi
          python3 - "$TARGET" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          target = sys.argv[1]
          artifacts = sorted(path for path in Path("dist").iterdir() if path.is_file())
          checksums = "".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in artifacts
          )
          Path(f"dist/checksums-{target}.txt").write_text(checksums, encoding="utf-8")
          PY

      - name: Upload channel artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  stage_github_release:
    name: Stage GitHub release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout generated release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify annotated tag provenance
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          test "$(git rev-list -n1 "refs/tags/${TAG}")" = "$RELEASE_SHA"

      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          merge-multiple: true
          path: built

      - name: Assemble checksums
        run: |
          cat built/checksums-*.txt | sort >built/SHA256SUMS
          rm built/checksums-*.txt
          test "$(find built -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 4
          test "$(find built -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = 2
          test "$(find built -maxdepth 1 -type f | wc -l | tr -d ' ')" = 7
          (cd built && sha256sum --check SHA256SUMS)

      - name: Create or recover canonical draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          expected_assets() {
            cat <<EOF
          SHA256SUMS
          rot-aarch64-apple-darwin.tar.gz
          rot-aarch64-unknown-linux-musl.tar.gz
          rot-x86_64-apple-darwin.tar.gz
          rot-x86_64-unknown-linux-musl.tar.gz
          rot_${VERSION}_amd64.deb
          rot_${VERSION}_arm64.deb
          EOF
          }

          canonical_valid() {
            diff -u \
              <(expected_assets | sort) \
              <(find dist -maxdepth 1 -type f -printf '%f\n' | sort) >/dev/null || return 1
            (cd dist && sha256sum --check SHA256SUMS >/dev/null)
          }

          canonical_matches_build() {
            canonical_valid || return 1
            while IFS= read -r asset; do
              cmp -- "built/${asset}" "dist/${asset}" >/dev/null || return 1
            done < <(expected_assets)
          }

          mkdir -p dist
          release_exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            release_state=$(gh release view \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease)
            draft=$(jq -r .isDraft <<<"$release_state")
            prerelease=$(jq -r .isPrerelease <<<"$release_state")
            if [[ "$prerelease" == true ]]; then
              echo "${TAG} is unexpectedly marked as a prerelease." >&2
              exit 1
            fi
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist || true
          fi

          if canonical_matches_build; then
            echo "Reusing release assets that exactly match the current deterministic build."
          elif [[ "$release_exists" == true && "$draft" != true ]]; then
            echo "Public release ${TAG} does not match the exact current build." >&2
            exit 1
          else
            rm -f dist/*
            cp built/* dist/
            if [[ "$release_exists" == true ]]; then
              while IFS= read -r asset; do
                gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
              done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            else
              notes_args=(--generate-notes)
              previous_public=$(gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --exclude-drafts \
                --exclude-pre-releases \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName // empty')
              if [[ -n "$previous_public" ]]; then
                notes_args+=(--notes-start-tag "$previous_public")
              fi
              gh release create "$TAG" "${notes_args[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --draft \
                --title "$TAG"
            fi
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          fi
          canonical_matches_build

      - name: Attest archives and Debian packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS

      - name: Preserve canonical release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-release-assets
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  cargo_release:
    name: Publish crates.io packages
    needs:
      - prepare
      - stage_github_release
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CRATES_IO_OWNER: ${{ vars.CRATES_IO_OWNER }}
    steps:
      - name: Checkout generated release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Authenticate with crates.io OIDC
        if: env.BOOTSTRAP_CARGO_TOKEN == ''
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish protocol then CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_CARGO_TOKEN || steps.crates_io_auth.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          exists() {
            if python3 - "$1" "$VERSION" "$GITHUB_REPOSITORY" "$2" "$CRATES_IO_OWNER" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          package, version, repository, expected_checksum, expected_owner = sys.argv[1:]
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/{package}/{version}",
              headers={"User-Agent": "rot-release"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  published = json.load(response)["version"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  raise SystemExit(1)
              print(f"crates.io returned HTTP {error.code} for {package} {version}", file=sys.stderr)
              raise SystemExit(2)
          except (OSError, KeyError, ValueError) as error:
              print(f"could not verify {package} {version}: {error}", file=sys.stderr)
              raise SystemExit(2)

          expected = f"https://github.com/{repository}".removesuffix(".git")
          actual = (published.get("repository") or "").removesuffix(".git")
          if published.get("crate") != package or published.get("num") != version:
              print(f"crates.io returned the wrong package identity for {package} {version}", file=sys.stderr)
              raise SystemExit(2)
          if published.get("yanked") is True:
              print(f"{package} {version} is yanked on crates.io", file=sys.stderr)
              raise SystemExit(2)
          if actual != expected:
              print(f"{package} {version} belongs to unexpected repository {actual!r}", file=sys.stderr)
              raise SystemExit(2)
          if published.get("checksum") != expected_checksum:
              print(f"{package} {version} does not match the locally packaged crate", file=sys.stderr)
              raise SystemExit(2)

          owners_request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/{package}/owners",
              headers={"User-Agent": "rot-release"},
          )
          try:
              with urllib.request.urlopen(owners_request, timeout=30) as response:
                  owners = json.load(response)["users"]
          except urllib.error.HTTPError as error:
              print(f"crates.io returned HTTP {error.code} for {package} owners", file=sys.stderr)
              raise SystemExit(2)
          except (OSError, KeyError, ValueError) as error:
              print(f"could not verify {package} owners: {error}", file=sys.stderr)
              raise SystemExit(2)
          owner_logins = {owner.get("login") for owner in owners}
          if expected_owner not in owner_logins:
              print(
                  f"{package} is not owned by configured crates.io owner {expected_owner!r}",
                  file=sys.stderr,
              )
              raise SystemExit(2)
          PY
            then
              return 0
            else
              status=$?
              [[ "$status" == 1 ]] && return 1
              exit "$status"
            fi
          }

          test -n "$CARGO_REGISTRY_TOKEN"
          test -n "$CRATES_IO_OWNER"
          cargo package -p rot-compiler-protocol --locked
          protocol_crate="target/package/rot-compiler-protocol-${VERSION}.crate"
          protocol_checksum=$(sha256sum "$protocol_crate" | awk '{print $1}')

          if exists rot-compiler-protocol "$protocol_checksum"; then
            echo "rot-compiler-protocol ${VERSION} is already published."
          else
            cargo publish -p rot-compiler-protocol --locked --token "$CARGO_REGISTRY_TOKEN"
          fi

          for attempt in {1..18}; do
            exists rot-compiler-protocol "$protocol_checksum" && break
            if [[ "$attempt" == 18 ]]; then
              echo "rot-compiler-protocol ${VERSION} did not become visible in time." >&2
              exit 1
            fi
            sleep 10
          done

          cargo package -p rot-metrics --locked
          rot_crate="target/package/rot-metrics-${VERSION}.crate"
          rot_checksum=$(sha256sum "$rot_crate" | awk '{print $1}')
          if exists rot-metrics "$rot_checksum"; then
            echo "rot-metrics ${VERSION} is already published."
          else
            cargo publish -p rot-metrics --locked --token "$CARGO_REGISTRY_TOKEN"
          fi

          for attempt in {1..18}; do
            exists rot-metrics "$rot_checksum" && break
            if [[ "$attempt" == 18 ]]; then
              echo "rot-metrics ${VERSION} did not become visible in time." >&2
              exit 1
            fi
            sleep 10
          done

  homebrew_validate:
    name: Validate Homebrew formula (${{ matrix.os }})
    needs:
      - prepare
      - stage_github_release
      - publish_github_release
    if: needs.prepare.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout generated release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download and verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          python3 .github/scripts/release.py verify-assets \
            --directory dist \
            --version "$VERSION"
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml" \
              --source-digest "$RELEASE_SHA"
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: daulet/homebrew-tap
          path: homebrew-tap

      - name: Render and validate formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          intel_sha=$(awk '$2 == "rot-x86_64-apple-darwin.tar.gz" { print $1 }' dist/SHA256SUMS)
          arm_sha=$(awk '$2 == "rot-aarch64-apple-darwin.tar.gz" { print $1 }' dist/SHA256SUMS)
          test -n "$intel_sha"
          test -n "$arm_sha"
          python3 .github/scripts/release.py homebrew \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --intel-sha "$intel_sha" \
            --arm-sha "$arm_sha" \
            --output homebrew-tap/Formula/rot.rb
          cd homebrew-tap
          brew style Formula/rot.rb
          brew tap daulet/tap
          audit_formula="$(brew --repo daulet/tap)/Formula/rot.rb"
          cp Formula/rot.rb "$audit_formula"
          brew audit --strict daulet/tap/rot
          brew install daulet/tap/rot
          brew test daulet/tap/rot
          test "$(rot --version)" = "rot ${VERSION}"
          brew uninstall rot

  publish_github_release:
    name: Publish GitHub release
    needs:
      - prepare
      - cargo_release
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Checkout generated release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download canonical workflow assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: canonical-release-assets
          path: canonical

      - name: Revalidate draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p draft
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir draft
          python3 .github/scripts/release.py verify-identical-assets \
            --canonical canonical \
            --candidate draft \
            --version "$VERSION"
          for asset in draft/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml" \
              --source-digest "$RELEASE_SHA"
          done

      - name: Publish fully staged draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          draft=$(jq -r .isDraft <<<"$release")
          prerelease=$(jq -r .isPrerelease <<<"$release")
          if [[ "$prerelease" == true ]]; then
            echo "${TAG} is unexpectedly marked as a prerelease." >&2
            exit 1
          elif [[ "$draft" == true ]]; then
            gh release edit "$TAG" \
              --draft=false \
              --prerelease=false \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "${TAG} is already public."
          fi
          test "$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv')" = $'false\tfalse'

  homebrew_release:
    name: Update Homebrew tap
    needs:
      - prepare
      - homebrew_validate
    if: needs.prepare.outputs.ready == 'true'
    runs-on: macos-15
    environment: release
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Require tap credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN"

      - name: Checkout generated release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download and verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          python3 .github/scripts/release.py verify-assets \
            --directory dist \
            --version "$VERSION"
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml" \
              --source-digest "$RELEASE_SHA"
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: daulet/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render current formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          intel_sha=$(awk '$2 == "rot-x86_64-apple-darwin.tar.gz" { print $1 }' dist/SHA256SUMS)
          arm_sha=$(awk '$2 == "rot-aarch64-apple-darwin.tar.gz" { print $1 }' dist/SHA256SUMS)
          test -n "$intel_sha"
          test -n "$arm_sha"
          python3 .github/scripts/release.py homebrew \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --intel-sha "$intel_sha" \
            --arm-sha "$arm_sha" \
            --output homebrew-tap/Formula/rot.rb
          ruby -c homebrew-tap/Formula/rot.rb

      - name: Commit tap update
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rot.rb
