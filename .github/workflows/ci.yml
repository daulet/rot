name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_RUST_VERSION: nightly-2026-08-27
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  stable:
    name: Stable Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install selected audit toolchain
        run: rustup toolchain install "$AUDIT_RUST_VERSION" --profile minimal

      - name: Format
        run: cargo fmt --all --check

      - name: Test all targets and features
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Package registry crates
        run: |
          cargo package -p rot-compiler-protocol --list >target/protocol-package-files.txt
          grep -Fx LICENSE-APACHE target/protocol-package-files.txt
          grep -Fx LICENSE-MIT target/protocol-package-files.txt
          cargo package -p rot-compiler-protocol --locked
          cargo package -p rot-metrics --list >target/rot-metrics-package-files.txt
          grep -Fx compiler/supported-rustc.toml target/rot-metrics-package-files.txt
          grep -Fx docs/releases.md target/rot-metrics-package-files.txt
          grep -Fx docs/rustc-backed-analysis.md target/rot-metrics-package-files.txt
          grep -Fx LICENSE-APACHE target/rot-metrics-package-files.txt
          grep -Fx LICENSE-MIT target/rot-metrics-package-files.txt
          cargo package -p rot-metrics --locked \
            --config 'patch.crates-io.rot-compiler-protocol.path="crates/rot-compiler-protocol"'

  compiler_driver:
    name: Pinned rustc driver
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned compiler toolchain
        run: >-
          rustup toolchain install "$AUDIT_RUST_VERSION"
          --profile minimal
          --component rustc-dev
          --component rust-src
          --component llvm-tools-preview

      - name: Test driver
        working-directory: compiler/rot-rustc-driver
        run: rustup run "$AUDIT_RUST_VERSION" cargo test --locked

  release_scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Shell syntax
        run: bash -n .github/scripts/package-deb.sh

  publish_release:
    name: Publish generated release
    needs:
      - stable
      - compiler_driver
      - release_scripts
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASES_ENABLED == 'true' &&
      startsWith(github.event.head_commit.message, 'chore(release): v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
