name: Release planner

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: rot-release-main
  queue: max

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  release:
    name: Plan and dispatch release
    if: >-
      vars.RELEASES_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Plan release
        id: plan
        env:
          SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'
          cargo run --quiet --locked \
            --manifest-path .github/rot-release/Cargo.toml -- \
            plan --source "$SOURCE" --remote-ref origin/main \
            --github-output "$GITHUB_OUTPUT"

      - name: Explain no-op
        if: steps.plan.outputs.state != 'new' && steps.plan.outputs.state != 'pending'
        env:
          STATE: ${{ steps.plan.outputs.state }}
        run: echo "Release planning is a no-op for state ${STATE}."

      - name: Materialize version commit
        id: materialize
        if: steps.plan.outputs.state == 'new'
        env:
          SOURCE: ${{ steps.plan.outputs.source }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE"
          cargo run --quiet --locked \
            --manifest-path .github/rot-release/Cargo.toml -- \
            set-version "$VERSION"

          cargo package -p rot-compiler-protocol --locked --allow-dirty
          cargo package -p rot-metrics --locked --allow-dirty \
            --config 'patch.crates-io.rot-compiler-protocol.path="crates/rot-compiler-protocol"'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Cargo.toml \
            Cargo.lock \
            compiler/rot-rustc-driver/Cargo.lock
          git diff --cached --check
          git diff --cached --name-only >actual-version-paths
          printf '%s\n' \
            Cargo.lock \
            Cargo.toml \
            compiler/rot-rustc-driver/Cargo.lock \
            >expected-version-paths
          diff -u expected-version-paths actual-version-paths
          git commit \
            -m "chore(release): ${TAG}" \
            -m '[skip ci]' \
            -m "Release-Source: ${SOURCE}" \
            -m 'Release-Automation: rot-v1'
          release_sha=$(git rev-parse HEAD)

          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ "$(git rev-parse origin/main)" != "$SOURCE" ]]; then
            echo "Main advanced before the version-commit push; a newer run owns the release."
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin 'HEAD:refs/heads/main'; then
            git fetch origin '+refs/heads/main:refs/remotes/origin/main'
            if [[ "$(git rev-parse origin/main)" != "$SOURCE" ]]; then
              echo "Main advanced during the version-commit push; a newer run owns the release."
              echo 'ready=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Version-commit push failed without a main race.' >&2
            exit 1
          fi
          echo 'ready=true' >>"$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >>"$GITHUB_OUTPUT"

      - name: Create or verify annotated tag
        id: tag
        if: >-
          steps.plan.outputs.state == 'pending' ||
          steps.materialize.outputs.ready == 'true'
        env:
          RELEASE_SHA: ${{ steps.materialize.outputs.release_sha || steps.plan.outputs.release_sha }}
          SOURCE: ${{ steps.plan.outputs.source }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo "The generated release is no longer the main tip; a newer run owns publication."
            exit 0
          fi

          verify_tag() {
            test "$(git cat-file -t "refs/tags/${TAG}")" = tag
            test "$(git rev-list -n1 "refs/tags/${TAG}")" = "$RELEASE_SHA"
          }

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            verify_tag
          else
            git tag -a "$TAG" "$RELEASE_SHA" \
              -m "Rot ${TAG}" \
              -m "Source: ${SOURCE}" \
              -m "Release: ${RELEASE_SHA}" \
              -m "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if ! git push origin "refs/tags/${TAG}"; then
              git tag --delete "$TAG"
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              verify_tag
            fi
          fi
          echo "release_sha=${RELEASE_SHA}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

      - name: Dispatch and follow distribution
        if: steps.tag.outputs.release_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.release_sha }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          find_run() {
            gh run list \
              --workflow release.yml \
              --event workflow_dispatch \
              --commit "$RELEASE_SHA" \
              --limit 20 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty'
          }

          run_id=$(find_run)
          if [[ -z "$run_id" ]]; then
            if ! gh workflow run release.yml --ref main -f "tag=${TAG}"; then
              echo "Dispatch returned an error; checking whether GitHub accepted it." >&2
            fi
            for attempt in {1..24}; do
              run_id=$(find_run)
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done
          fi
          if [[ -z "$run_id" ]]; then
            echo "Could not find the distribution workflow for ${TAG}." >&2
            exit 1
          fi

          status=$(gh run view "$run_id" --json status --jq .status)
          if [[ "$status" == completed ]]; then
            conclusion=$(gh run view "$run_id" --json conclusion --jq .conclusion)
            if [[ "$conclusion" == success ]]; then
              echo "Distribution for ${TAG} already completed successfully."
              exit 0
            fi
            echo "Distribution run ${run_id} concluded ${conclusion}; rerun its failed jobs." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
