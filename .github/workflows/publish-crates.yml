name: Publish crates.io packages

on:
  workflow_call:
    inputs:
      plan:
        description: dist release plan JSON
        required: true
        type: string

permissions: {}

env:
  RUST_VERSION: 1.98.0

jobs:
  publish:
    name: Publish crates.io packages
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout caller commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Authenticate with crates.io OIDC
        if: env.BOOTSTRAP_CARGO_TOKEN == ''
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish protocol then CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_CARGO_TOKEN || steps.crates_io_auth.outputs.token }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail

          test -n "$CARGO_REGISTRY_TOKEN"
          version=$(jq -er '
            [.releases[]? | select(.app_name == "rot-metrics") | .app_version]
            | if length == 1 then .[0]
              else error("expected exactly one rot-metrics release")
              end
          ' <<<"$PLAN")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version in dist plan: ${version}" >&2
            exit 1
          fi
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT

          crate_exists() {
            local package=$1
            local status
            if ! status=$(curl \
              --connect-timeout 10 \
              --max-time 30 \
              --silent \
              --show-error \
              --location \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'User-Agent: rot-release' \
              "https://crates.io/api/v1/crates/${package}/${version}"); then
              echo "Could not query crates.io for ${package} ${version}." >&2
              return 2
            fi

            case "$status" in
              200)
                if ! jq -e \
                  --arg package "$package" \
                  --arg version "$version" \
                  '.version.crate == $package and .version.num == $version and .version.yanked != true' \
                  "$response" >/dev/null; then
                  echo "crates.io returned an invalid response for ${package} ${version}." >&2
                  return 2
                fi
                return 0
                ;;
              404)
                return 1
                ;;
              *)
                echo "crates.io returned HTTP ${status} for ${package} ${version}." >&2
                return 2
                ;;
            esac
          }

          wait_until_visible() {
            local package=$1
            local attempt status
            for attempt in {1..18}; do
              if crate_exists "$package"; then
                return 0
              else
                status=$?
              fi
              if [[ "$status" != 1 ]]; then
                return "$status"
              fi
              if [[ "$attempt" == 18 ]]; then
                echo "${package} ${version} did not become visible in time." >&2
                return 2
              fi
              sleep 10
            done
          }

          publish_if_missing() {
            local package=$1
            local status
            if crate_exists "$package"; then
              echo "${package} ${version} is already published."
            else
              status=$?
              if [[ "$status" != 1 ]]; then
                return "$status"
              fi
              cargo publish -p "$package" --locked
            fi
            wait_until_visible "$package"
          }

          publish_if_missing rot-compiler-protocol
          publish_if_missing rot-metrics
