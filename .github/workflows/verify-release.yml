name: Verify release

on:
  workflow_call:

permissions: {}

env:
  RUST_VERSION: 1.98.0

jobs:
  verify:
    name: Verify generated release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout caller commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify release provenance
        env:
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$TAG" == "dry-run" ]]; then
            echo "Dry run: no generated release is required."
            exit 0
          fi
          if [[ "$RELEASES_ENABLED" != "true" ]]; then
            echo "Release dispatch is disabled; set RELEASES_ENABLED=true to continue." >&2
            exit 1
          fi
          if [[ -z "$TAG" ]]; then
            echo "A workflow-dispatch tag is required." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH: ${TAG}" >&2
            exit 1
          fi

          git fetch --force --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

          plan=$(cargo run --quiet --locked \
            --manifest-path .github/rot-release/Cargo.toml -- \
            plan --source "$GITHUB_SHA" --remote-ref origin/main)
          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg tag "$TAG" \
            '.state == "pending" and .release_sha == $sha and .tag == $tag' \
            <<<"$plan" >/dev/null

          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          test "$(git rev-list -n1 "refs/tags/${TAG}")" = "$GITHUB_SHA"
