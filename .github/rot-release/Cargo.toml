[workspace]
resolver = "3"

[package]
name = "rot-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.6", features = ["derive"] }
semver = "1.0.27"
serde_json = "1.0.151"
tempfile = "3.27.0"
toml_edit = "0.25.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
